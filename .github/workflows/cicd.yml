name: Flutter CI/CD Android

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Deploy Android
    runs-on: home-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # - name: Set up Flutter
      #   uses: subosito/flutter-action@v2
      #   with:
      #     channel: stable
      #     cache: true

      - name: Check Flutter installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Extract version number
        id: extract_version
        run: |
          $version = (Select-String -Path .\pubspec.yaml -Pattern '^version:').Line.Split(':')[1].Trim()
          echo "VERSION_NAME=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rename APK
        run: |
          $newName = "app-release-$env:VERSION_NAME.apk"
          Rename-Item -Path "build\app\outputs\flutter-apk\app-release.apk" -NewName $newName
          echo "APK_PATH=build\app\outputs\flutter-apk\$newName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_NAME }}.apk
          path: ${{ env.APK_PATH }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install requests

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python .github/send_telegram.py
